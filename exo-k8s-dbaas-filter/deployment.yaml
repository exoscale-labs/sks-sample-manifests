---
apiVersion: v1
kind: Namespace
metadata:
  name: exoscale-automation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dbaas-filter-config
  namespace: exoscale-automation
data:
  # SKS Clusters to monitor (format: "cluster-name:zone,cluster-name:zone")
  sks-clusters: "my-cluster:ch-gva-2"

  # DBaaS services to update (format: "db-name:zone:type,db-name:zone:type")
  # Supported types: pg, mysql, kafka, opensearch, valkey, grafana
  dbaas-services: "my-postgres-db:ch-gva-2:pg"

  # Optional: Static IPs to always include (CIDR format).
  # These are added to the node IPs, they never stand in for them: if the node
  # inventory cannot be established, no entry is removed and the filter is never
  # reduced to these entries alone.
  static-ips: ""  # Example: "192.168.1.1/32,10.0.0.0/24"

  # Check interval in seconds (default: 10)
  check-interval: "60"

  # Log level: DEBUG, INFO, WARNING, ERROR (default: INFO)
  log-level: "INFO"

  # Log the intended changes without applying them. Useful for validating a new
  # version against a real cluster before letting it write.
  dry-run: "false"

  # Retries per API request, after the initial attempt (default: 3)
  max-retries: "3"

  # Per-request timeout in seconds (default: 30)
  request-timeout: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exo-dbaas-filter
  namespace: exoscale-automation
  labels:
    app: exo-dbaas-filter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exo-dbaas-filter
  template:
    metadata:
      labels:
        app: exo-dbaas-filter
    spec:
      containers:
      - name: exo-dbaas-filter
        # Pin an immutable tag or digest in production. With the ":latest" tag,
        # "IfNotPresent" would keep a node on whatever image it cached first, so
        # the Deployment silently never picks up a new version.
        image: ghcr.io/exoscale-labs/dbaas-ip-filter:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
          - name: EXOSCALE_API_KEY
            valueFrom:
              secretKeyRef:
                name: exoscale-api-credentials
                key: api-key
          - name: EXOSCALE_API_SECRET
            valueFrom:
              secretKeyRef:
                name: exoscale-api-credentials
                key: api-secret
          - name: SKS_CLUSTERS
            valueFrom:
              configMapKeyRef:
                name: dbaas-filter-config
                key: sks-clusters
          - name: DBAAS_SERVICES
            valueFrom:
              configMapKeyRef:
                name: dbaas-filter-config
                key: dbaas-services
          - name: STATIC_IPS
            valueFrom:
              configMapKeyRef:
                name: dbaas-filter-config
                key: static-ips
          - name: CHECK_INTERVAL
            valueFrom:
              configMapKeyRef:
                name: dbaas-filter-config
                key: check-interval
          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: dbaas-filter-config
                key: log-level
          - name: DRY_RUN
            valueFrom:
              configMapKeyRef:
                name: dbaas-filter-config
                key: dry-run
                optional: true
          - name: MAX_RETRIES
            valueFrom:
              configMapKeyRef:
                name: dbaas-filter-config
                key: max-retries
                optional: true
          - name: REQUEST_TIMEOUT
            valueFrom:
              configMapKeyRef:
                name: dbaas-filter-config
                key: request-timeout
                optional: true

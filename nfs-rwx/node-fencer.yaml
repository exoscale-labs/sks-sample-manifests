# Applies node.kubernetes.io/out-of-service to nodes whose VM Exoscale reports
# as stopped, so the NFS server is restarted on another node without anyone
# having to step in. See image/node-fencer.sh for the exact rules.
#
# Included in install.yaml. With Helm, apply it separately:
#   kubectl apply -f node-fencer.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-fencer
  namespace: nfs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nfs-rwx-node-fencer
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, patch]
  # Node leases in kube-node-lease: is the kubelet still alive?
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nfs-rwx-node-fencer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nfs-rwx-node-fencer
subjects:
  - kind: ServiceAccount
    name: node-fencer
    namespace: nfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-fencer
  namespace: nfs
spec:
  # Two copies on different nodes, so the node that dies cannot take the only
  # copy with it. Both act on the same rules; tainting twice is harmless. On a
  # single node cluster the second copy stays Pending, which is fine.
  replicas: 2
  # Replace one copy at a time, removing the old one first: with one copy per
  # node, a new copy can otherwise find no free node and the update hangs.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: node-fencer
  template:
    metadata:
      labels:
        app: node-fencer
    spec:
      serviceAccountName: node-fencer
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: node-fencer
      # A copy on a node that went away is replaced after 30 s instead of the
      # default 5 minutes.
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-fencer
          image: ghcr.io/exoscale-labs/nfs-rwx:0.1.2
          command: ["/node-fencer.sh"]
          env:
            # Seconds a node must stay shut down before it is fenced.
            - name: SHUTDOWN_FOR
              value: "60"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The loop touches /tmp/heartbeat after every round. Restart the
          # container if it stops doing that, for example on a hung API call.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 180 ]'
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

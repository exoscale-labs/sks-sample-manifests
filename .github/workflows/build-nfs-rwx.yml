name: Build nfs-rwx Container

on:
  push:
    branches:
      - main
    paths:
      - 'nfs-rwx/**'
      - '.github/workflows/build-nfs-rwx.yml'
    tags:
      - 'nfs-rwx-v*'
  pull_request:
    paths:
      - 'nfs-rwx/**'
      - '.github/workflows/build-nfs-rwx.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: exoscale-labs/nfs-rwx

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -s sh nfs-rwx/image/*.sh nfs-rwx/image/tests/*.sh nfs-rwx/image/tests/kubectl nfs-rwx/hack/render.sh

      - name: install.yaml matches values.yaml and node-fencer.yaml
        run: |
          nfs-rwx/hack/render.sh
          git diff --exit-code nfs-rwx/install.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: ./nfs-rwx/image
          file: ./nfs-rwx/image/Dockerfile
          platforms: linux/amd64
          load: true
          tags: nfs-rwx:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image contents
        run: |
          docker run --rm --entrypoint sh nfs-rwx:test -c '
            set -e
            kubectl version --client
            jq --version
            test "$(readlink /var/lib/nfs/ganesha)" = /export
            # RecoverySkipIp needs Ganesha 11 or later.
            major=$(ganesha.nfsd -v | sed -n "s/.*Release = V\([0-9]*\).*/\1/p")
            echo "Ganesha major version: $major"
            test "$major" -ge 11'

      - name: Entrypoint tests
        run: docker run --rm -v "$PWD/nfs-rwx/image/tests:/tests:ro" --entrypoint sh nfs-rwx:test /tests/test-entrypoint.sh

      - name: Node fencer tests
        run: docker run --rm -v "$PWD/nfs-rwx/image/tests:/tests:ro" --entrypoint sh nfs-rwx:test /tests/test-node-fencer.sh

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=nfs-rwx-v(.*),group=1
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./nfs-rwx/image
          file: ./nfs-rwx/image/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

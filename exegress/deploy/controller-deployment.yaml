---
# Exoscale API credentials for the controller. Replace the values (or create the
# Secret out-of-band) with an IAM key scoped to: compute instance read, private
# network read, elastic-IP attach/detach. The controller never creates/deletes EIPs.
apiVersion: v1
kind: Secret
metadata:
  name: exegress-exoscale-creds
  namespace: kube-system
type: Opaque
stringData:
  api-key: "REPLACE_ME"
  api-secret: "REPLACE_ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exegress-controller
  namespace: kube-system
  labels:
    app: exegress-controller
spec:
  replicas: 1 # safe to raise to 2 (leader election is enabled below)
  selector:
    matchLabels:
      app: exegress-controller
  template:
    metadata:
      labels:
        app: exegress-controller
    spec:
      serviceAccountName: exegress-controller
      containers:
        - name: controller
          image: ghcr.io/exoscale-labs/exegress-controller:latest
          env:
            - name: EXOSCALE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: exegress-exoscale-creds
                  key: api-key
            - name: EXOSCALE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: exegress-exoscale-creds
                  key: api-secret
            - name: EXOSCALE_ZONE
              value: "REPLACE_ZONE" # e.g. de-fra-1
            - name: EXEGRESS_PN_ID
              value: "REPLACE_PRIVATE_NETWORK_UUID"
            - name: EXEGRESS_LEADER_ELECT
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

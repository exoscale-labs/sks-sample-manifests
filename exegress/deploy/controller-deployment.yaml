# The controller reads ALL its config from a Secret + ConfigMap (see the README
# quick start for the copy-paste commands that create them) — no need to edit
# this manifest.
#
#   Secret    exegress-exoscale-creds : EXOSCALE_API_KEY, EXOSCALE_API_SECRET
#   ConfigMap exegress-config         : EXOSCALE_ZONE, EXEGRESS_PN_ID, EXEGRESS_LEADER_ELECT
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exegress-controller
  namespace: kube-system
  labels:
    app: exegress-controller
spec:
  replicas: 2 # leader election is enabled; the standby takes over on node loss
  selector:
    matchLabels:
      app: exegress-controller
  template:
    metadata:
      labels:
        app: exegress-controller
    spec:
      serviceAccountName: exegress-controller
      # Spread replicas across nodes so a single node eviction can't take out
      # both. Preferred (not required) so it still schedules on a 1-node cluster.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: exegress-controller
      containers:
        - name: controller
          image: ghcr.io/exoscale-labs/exegress-controller:latest
          envFrom:
            - secretRef:
                name: exegress-exoscale-creds
            - configMapRef:
                name: exegress-config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]

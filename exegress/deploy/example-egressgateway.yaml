apiVersion: exegress.io/v1alpha1
kind: EgressGateway
metadata:
  name: mail-relay
spec:
  elasticIP:
    id: "REPLACE_WITH_EIP_UUID"
    address: "REPLACE_WITH_EIP_ADDRESS"
  destinations: # any number of CIDRs — single IPs (/32) and subnets both work
    - "192.0.2.25/32"    # a single host, e.g. the mail relay
    - "203.0.113.10/32"  # another single host
    - "198.51.100.0/24"  # a whole subnet — all traffic to it exits via the EIP
  gatewayNodeSelector:
    matchLabels:
      exegress.io/eligible: "true"
  # interfaces:        # optional; defaults to eth0/eth1 on Exoscale nodes
  #   public: eth0
  #   private: eth1
